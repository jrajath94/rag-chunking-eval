[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chunking-eval"
version = "0.1.0"
description = "Measured comparison of RAG chunking strategies: fixed, semantic, hierarchical."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
